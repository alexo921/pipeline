version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    container_name: pipeline-postgres
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: pipeline-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

  # LLM Server
  llm-server:
    build:
      context: .
      dockerfile: simple_llm_server.Dockerfile
    container_name: pipeline-llm-server
    ports:
      - "1337:1337"
    restart: unless-stopped

  # Pip Chatbot (Rasa)
  pip-chatbot:
    build:
      context: .
      dockerfile: rasa/Dockerfile
    container_name: pipeline-pip-chatbot
    ports:
      - "5005:5005"
      - "5055:5055"
    volumes:
      - ./rasa/models:/app/rasa/models
      - ./rasa/logs:/app/rasa/logs
      - ./rasa/data:/app/rasa/data
    depends_on:
      - chromadb
      - llm-server
    restart: unless-stopped

volumes:
  postgres_data:
  chromadb_data:

networks:
  default:
    name: pipeline-network
