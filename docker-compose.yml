version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    container_name: pipeline-postgres
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis for job queues
  redis:
    image: redis:7-alpine
    container_name: pipeline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # (ChromaDB removed)

  # (LLM server removed)

  # Backend API (NestJS)
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: pipeline-api
    environment:
      - NODE_ENV=production
      # Point to Postgres service inside the compose network
      - DATABASE_URL=postgresql://pipeline:pipeline_password@postgres:5432/pipeline?schema=public
      # Point to Redis service inside the compose network
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Web Dashboard (Next.js)
  web-dashboard:
    build:
      context: ./frontend/web-dashboard
      dockerfile: Dockerfile
    container_name: pipeline-web
    environment:
      - NODE_ENV=production
      # Frontend talks to the public API domain in production
      - NEXT_PUBLIC_API_URL=https://api.pipelineworkforce.com
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # (Pip Chatbot removed)

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: pipeline-network
