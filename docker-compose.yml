version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    container_name: pipeline-postgres
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis for job queues
  redis:
    image: redis:7-alpine
    container_name: pipeline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: pipeline-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

  # LLM Server (Fine-tuned)
  llm-server:
    build:
      context: .
      dockerfile: llama_server_finetuned.Dockerfile
    container_name: pipeline-llm-server
    volumes:
      - /home/ubuntu/.local/share/Jan/data/llamacpp/models/llama-3.1-8b-instruct-q5_k_m.gguf:/app/models/llama-3.1-8b-instruct-q5_k_m.gguf:ro
      - ./healthcare_lora_adapter:/app/adapters/healthcare_lora_adapter:ro
    environment:
      - ADAPTER_PATH=/app/adapters/healthcare_lora_adapter
      - MODEL_PATH=/app/models/llama-3.1-8b-instruct-q5_k_m.gguf
      - HF_HOME=/tmp/huggingface
    ports:
      - "1337:1337"
    restart: unless-stopped

  # Pip Chatbot (Rasa)
  pip-chatbot:
    build:
      context: .
      dockerfile: rasa/Dockerfile
    container_name: pipeline-pip-chatbot
    ports:
      - "5005:5005"
      - "5055:5055"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/tmp/chromadb
    volumes:
      - ./rasa/models:/app/rasa/models
      - ./rasa/logs:/app/rasa/logs
      - ./rasa/data:/app/rasa/data
    depends_on:
      - chromadb
      - llm-server
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chromadb_data:

networks:
  default:
    name: pipeline-network
