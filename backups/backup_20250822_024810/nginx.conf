server {
    if ($host = www.pipelineworkforce.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = pipelineworkforce.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pipelineworkforce.com www.pipelineworkforce.com;
    return 301 https://$server_name$request_uri;




}

server {
    listen 443 ssl;
    server_name pipelineworkforce.com www.pipelineworkforce.com;
    ssl_certificate /etc/letsencrypt/live/pipelineworkforce.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pipelineworkforce.com/privkey.pem; # managed by Certbot
    
    # API Backend Routes - Route /api/ to backend container on port 3001
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }

    # Admin Panel Routes
    location /admin/ {
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Routes - Default catch-all for everything else
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }


}

# API Subdomain Configuration
server {
    if ($host = api.pipelineworkforce.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.pipelineworkforce.com;
    return 301 https://$server_name$request_uri;


}

server {
    listen 443 ssl;
    server_name api.pipelineworkforce.com;
    ssl_certificate /etc/letsencrypt/live/pipelineworkforce.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pipelineworkforce.com/privkey.pem; # managed by Certbot
    
    # All requests to api.pipelineworkforce.com go to backend
    location / {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        
        # CORS headers for API
        add_header 'Access-Control-Allow-Origin' 'https://pipelineworkforce.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://pipelineworkforce.com';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

}
