version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: action_rag_enhanced_chat

- rule: Always respond with action for shift reflection
  steps:
  - intent: shift_reflection
  - action: action_rag_enhanced_chat

- rule: Always respond with action for stress expression
  steps:
  - intent: express_stress
  - action: action_rag_enhanced_chat

- rule: Always respond with action for safety issues
  steps:
  - intent: report_safety_issue
  - action: action_rag_enhanced_chat

- rule: Always respond with action for harassment reports
  steps:
  - intent: safety_emergency
  - action: action_rag_enhanced_chat

- rule: Always respond with action for supervisor issues
  steps:
  - intent: express_concern
  - action: action_rag_enhanced_chat

- rule: Always respond with action for workload discussions
  steps:
  - intent: discuss_workload
  - action: action_rag_enhanced_chat

- rule: Always respond with action for issue reports
  steps:
  - intent: report_issue
  - action: action_rag_enhanced_chat

- rule: Always respond with action for support requests
  steps:
  - intent: request_support
  - action: action_rag_enhanced_chat

- rule: Always respond with action for training queries
  steps:
  - intent: training_query
  - action: action_rag_enhanced_chat

- rule: Always respond with action for policy questions
  steps:
  - intent: policy_query
  - action: action_rag_enhanced_chat

- rule: Always respond with action for gratitude
  steps:
  - intent: express_gratitude
  - action: action_rag_enhanced_chat

- rule: Always respond with action for success sharing
  steps:
  - intent: share_success
  - action: action_rag_enhanced_chat

- rule: Always respond with action for PHI mentions
  steps:
  - intent: mention_phi
  - action: action_rag_enhanced_chat

- rule: Always respond with action for feedback
  steps:
  - intent: share_feedback
  - action: action_rag_enhanced_chat

- rule: Always respond with action for schedule queries
  steps:
  - intent: schedule_query
  - action: action_rag_enhanced_chat

- rule: Always respond with action for availability queries
  steps:
  - intent: availability_query
  - action: action_rag_enhanced_chat

- rule: Always respond with action for time off requests
  steps:
  - intent: time_off_request
  - action: action_rag_enhanced_chat

- rule: Always respond with action for shift swap requests
  steps:
  - intent: shift_swap_request
  - action: action_rag_enhanced_chat

- rule: Always respond with action for self-harm concerns
  steps:
  - intent: self_harm_concern
  - action: action_rag_enhanced_chat

- rule: Fallback rule for any other intent
  steps:
  - or:
    - intent: nlu_fallback
    - intent: out_of_scope
    - intent: affirm
    - intent: deny
    - intent: bot_challenge
  - action: action_rag_enhanced_chat

- rule: Universal action rule - ALL intents go to action
  steps:
  - or:
    - intent: greet
    - intent: goodbye
    - intent: mood_great
    - intent: mood_unhappy
    - intent: inform
    - intent: request_info
    - intent: ask_shift_details
    - intent: document_shift
    - intent: get_schedule_info
    - intent: request_support
    - intent: share_feedback
  - action: action_rag_enhanced_chat