- regex: hours_worked
  examples: |
    - ([0-9]{1,2}(\.[0-9])?)\s?(h|hr|hrs|hours)

- regex: patient_load
  examples: |
    - ([0-3]?[0-9])\s?(patients?|pt?s?)

- regex: shift_date
  examples: |
    - (today|yesterday|tomorrow|Mon(day)?|Tue(sday)?|Wed(nesday)?|Thu(rsday)?|Fri(day)?|Sat(urday)?|Sun(day)?)
    - (20[0-9]{2}-[01][0-9]-[0-3][0-9])

- regex: phone_number
  examples: |
    - (\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}

- regex: room_number
  examples: |
    - \b[0-9]{1,3}[A-Z]?\b

- regex: overtime
  examples: |
    - \b(OT|overtime|time[-\s]?and[-\s]?a[-\s]?half)\b

- regex: leave_terms
  examples: |
    - \b(PTO|paid time off|LOA|leave of absence|FMLA)\b