<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>
<body>
  <div
    style="max-width: 600px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 5px 30px rgba(0, 0, 0, 0.05);"
  >
    <!-- Content -->
    <div
      style="background-color: white; padding: 40px 30px; border-radius: 0 0 12px 12px;"
    >
      <!-- Logo -->
      <div style="text-align: center;">
        <div>
          <img src="./logo-full-color.svg" alt="Pipeline logo" width="150px" />
        </div>
      </div>

      <!-- Icon -->
      <div style="text-align: center; margin: 32px 0;">
        <div
          style="width: 64px; height: 64px; background: linear-gradient(135deg, #0891b2, #0e7490); border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;"
        >
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="2"
          >
            <path d="M9 12l2 2 4-4" />
            <path
              d="M21 12c-1 0-3-1-3-3s2-3 3-3 3 1 3 3-2 3-3 3"
            />
            <path
              d="M3 12c1 0 3-1 3-3s-2-3-3-3-3 1-3 3 2 3 3 3"
            />
            <path
              d="M12 3c0 1-1 3-3 3s-3-2-3-3 1-3 3-3 3 2 3 3"
            />
            <path
              d="M12 21c0-1 1-3 3-3s3 2 3 3-1 3-3 3-3-2-3-3"
            />
          </svg>
        </div>
      </div>

      <!-- Heading -->
      <h2
        style="color: #1e293b; font-size: 24px; font-weight: 600; text-align: center; margin: 0 0 24px 0;"
      >
        Verify Your Email
      </h2>

      <!-- Message -->
      <p
        style="font-size: 16px; color: #64748b; line-height: 1.6; text-align: center; margin-bottom: 32px;"
      >
        Welcome to Pipeline! To complete your registration, please verify your email address by clicking the button below.
      </p>

      <!-- CTA Button -->
      <div style="text-align: center; margin: 40px 0;">
        <a href="{{url}}"
          style="display: inline-block; padding: 16px 32px; font-size: 16px; font-weight: 600; color: white; background: linear-gradient(135deg, #0891b2, #0e7490); text-decoration: none; border-radius: 8px; box-shadow: 0 4px 14px rgba(8, 145, 178, 0.3); transition: all 0.2s ease;"
        >
          ✔ Confirm Email
        </a>
      </div>

      <!-- Security Info -->
      <div
        style="background-color: #f1f5f9; padding: 20px; border-radius: 8px; margin: 32px 0;"
      >
        <p
          style="font-size: 14px; color: #475569; margin: 0; line-height: 1.5;"
        >
          <strong>Important:</strong> This link will expire in 24 hours. If you didn’t create this account, please ignore this email.
        </p>
      </div>

      <!-- Footer -->
      <div
        style="text-align: center; padding: 24px 30px; color: #94a3b8; font-size: 12px;"
      >
        <p style="margin: 0;">© 2025 Pipeline.</p>
      </div>
    </div>
  </div>
</body>
</html>
